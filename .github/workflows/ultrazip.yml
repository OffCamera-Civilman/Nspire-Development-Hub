name: Build UltraZIP 003

on:
  workflow_dispatch:
  push:
    paths:
      - 'UltraZIP/**'
      - '.github/workflows/ultrazip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ZIP dependency in UltraZIP directory
        run: |
          set -euxo pipefail
          cd UltraZIP
          sh ./get_miniz.sh
          test -s vendor/miniz/miniz.h
      - name: Build using the same Ndless container as UltraGBA
        run: |
          set -euxo pipefail
          docker pull bensuperpc/ndless:latest
          docker run --rm --entrypoint /bin/sh \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" \
            --workdir /work/UltraZIP \
            bensuperpc/ndless:latest \
            -c 'set -eu; command -v nspire-gcc; command -v nspire-ld; command -v genzehn; make clean all'
      - name: Confirm TNS and checksum
        run: |
          test -s UltraZIP/UltraZIP_003.tns
          file UltraZIP/UltraZIP_003.tns
          sha256sum UltraZIP/UltraZIP_003.tns
      - name: Upload calculator executable
        uses: actions/upload-artifact@v4
        with:
          name: UltraZIP_003_TNS
          path: UltraZIP/UltraZIP_003.tns
          if-no-files-found: error
