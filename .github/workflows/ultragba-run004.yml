name: UltraGBA Run004 - Custom RTC and Local Data

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ultragba-run004.yml'
      - 'Projects/UltraGBA/run004_patch.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned gpSP source with GBZ paging support
        run: |
          set -euxo pipefail
          git clone https://github.com/andymcca/lr-gpsp-nspire.git upstream-gpsp
          git -C upstream-gpsp checkout 2ddeb23b565cab84e20278bb73ed76f3d91b25f5
          git -C upstream-gpsp rev-parse HEAD > upstream-commit.txt
      - name: Apply safe ROM-local save patch
        run: |
          set -euxo pipefail
          python3 Projects/UltraGBA/run004_patch.py
          git -C upstream-gpsp diff --check
      - name: Build Ndless TI-Nspire binary
        run: |
          set -euxo pipefail
          docker pull bensuperpc/ndless:latest
          docker run --rm --entrypoint /bin/sh \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" \
            --workdir /work/upstream-gpsp \
            bensuperpc/ndless:latest \
            -c 'set -eu; command -v nspire-gcc; command -v nspire-g++; command -v genzehn; make -j2'
      - name: Package distinct Run004 output
        run: |
          set -euxo pipefail
          test -s upstream-gpsp/gpsp_libretro.tns
          mkdir -p dist
          cp upstream-gpsp/gpsp_libretro.tns dist/UltraGBA_Run004_CustomRTC_Preview.tns
          cp upstream-commit.txt dist/
          sha256sum dist/*.tns > dist/SHA256SUMS.txt
          cat > dist/README.txt <<'EOF'
          Run004 Custom RTC preview — experimental. Keep the old emulator and ALL existing saves.
          ROM saves, states and per-game settings remain beside ROMs.
          Emulator-managed files now use UltraGBA_Data beside emulator; old central folder is untouched.
          Large ZIP ROMs may still run out of RAM: use GBZ instead.
          Use upstream tools/gbz.py pack GAME.zip.tns on Android/Termux;
          copy the resulting GAME.gbz.tns to the Nspire.
          GBZ page-based loading uses the selected ROM buffer, e.g. 8 MiB.
          Existing central files stay in their old location; no automatic migration.\n          Test new games or backed-up saves; do not remove originals. Custom RTC menu included: select System/Custom, set date and Apply RTC. Custom clock advances while emulator runs; offline elapsed-time recovery is not yet implemented.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: UltraGBA_Run004_LocalData_Preview
          path: dist/
          if-no-files-found: error
