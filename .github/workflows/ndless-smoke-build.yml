name: Ndless Calculator Builds

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/ndless-smoke/**'
      - 'Projects/UltraGBA/**'
      - '.github/workflows/ndless-smoke-build.yml'

permissions:
  contents: read

jobs:
  build-smoke:
    name: Build calculator programs
    runs-on: ubuntu-24.04
    container: debian:13-slim
    defaults:
      run:
        shell: bash
    steps:
      - name: Install official Ndless SDK
        env:
          GH_TOKEN: ${{ github.token }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl git jq

          release=https://api.github.com/repos/ndless-nspire/Ndless/releases/tags/nightly
          asset=$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$release" |
            jq -ce '[.assets[] | select(.state == "uploaded" and
              (.name | startswith("ndless-sdk_") and endswith("_amd64.deb")))]
              | max_by(.created_at) // empty')
          url=$(jq -er '.browser_download_url' <<< "$asset")
          digest=$(jq -er '.digest | capture("^sha256:(?<sha>[0-9a-f]{64})$").sha' <<< "$asset")
          curl -fsSL --retry 3 -o /tmp/ndless-sdk.deb "$url"
          printf '%s  /tmp/ndless-sdk.deb\n' "$digest" | sha256sum --check
          apt-get install -y --no-install-recommends /tmp/ndless-sdk.deb
          dpkg-query -W ndless-sdk

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compile and verify Run001
        working-directory: tools/ndless-smoke
        run: |
          make
          genzehn --info --input NspireSmoke_Run001.zehn
          test -s NspireSmoke_Run001.tns
          sha256sum NspireSmoke_Run001.tns

      - name: Upload calculator program
        uses: actions/upload-artifact@v4
        with:
          name: NspireSmoke_Run001
          path: tools/ndless-smoke/NspireSmoke_Run001.tns
          if-no-files-found: error

      - name: Build and exercise UltraGBA Run001
        run: |
          apt-get install -y --no-install-recommends gcc g++ zlib1g-dev
          bash Projects/UltraGBA/build.sh "$RUNNER_TEMP/ultragba"

      - name: Upload UltraGBA and its test cartridge
        uses: actions/upload-artifact@v4
        with:
          name: UltraGBA_Run001
          path: ${{ runner.temp }}/ultragba/*.tns
          if-no-files-found: error

      - name: Upload matching emulator source
        uses: actions/upload-artifact@v4
        with:
          name: UltraGBA_Run001-source
          path: ${{ runner.temp }}/ultragba/UltraGBA_Run001-source.tar.gz
          if-no-files-found: error
