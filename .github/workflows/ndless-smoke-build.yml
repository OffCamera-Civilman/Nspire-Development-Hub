name: Ndless SDK Smoke Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/ndless-smoke/**'
      - '.github/workflows/ndless-smoke-build.yml'

permissions:
  contents: read

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull Ndless compiler image
        run: docker pull ndless/ndless-sdk:latest
      - name: Compile Run001 in Ndless SDK
        run: |
          set -euxo pipefail
          docker run --rm --entrypoint /bin/sh \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" \
            --workdir /work \
            ndless/ndless-sdk:latest \
            -c 'set -eu; command -v nspire-gcc; command -v nspire-ld; command -v genzehn; make -C tools/ndless-smoke clean all'
      - name: Verify .tns output
        run: |
          test -s tools/ndless-smoke/NspireSmoke_Run001.tns
          file tools/ndless-smoke/NspireSmoke_Run001.tns
          sha256sum tools/ndless-smoke/NspireSmoke_Run001.tns
      - name: Upload .tns file
        uses: actions/upload-artifact@v4
        with:
          name: NspireSmoke_Run001
          path: tools/ndless-smoke/NspireSmoke_Run001.tns
          if-no-files-found: error
